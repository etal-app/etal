          <p className="loyalty-hint">Votre réponse : {r.reply}</p>
          {canReply && (
            <button className="ghost-link" onClick={() => setEditing(true)}>
              Modifier
            </button>
          )}
        </div>
      ) : !canReply ? (
        <p className="upsell-note">🔒 Réponse aux avis réservée aux offres Pro et Premium.</p>
      ) : editing || !r.reply ? (
        <div className="reply-form">
          <input
            placeholder="Répondre à cet avis…"
            value={replyText}
            onChange={(e) => setReplyText(e.target.value)}
          />
          <button
            className="secondary-btn small"
            disabled={!replyText.trim()}
            onClick={() => {
              onReply(username, replyText);
              setEditing(false);
            }}
          >
            Envoyer
          </button>
        </div>
      ) : null}
    </li>
  );
}

function ManageShop({ shop, stats, posts, ratings, onBack, onUpdateShop, onPublishPost, onPublishAlert, onValidateVisit, views, onReply, customers }) {
  const [section, setSection] = useState("posts");
  const [postText, setPostText] = useState("");
  const [postImg, setPostImg] = useState("");
  const [postImgLoading, setPostImgLoading] = useState(false);
  const [alertMode, setAlertMode] = useState("promo");
  const [presetId, setPresetId] = useState(PROMO_PRESETS[0].id);
  const [produit, setProduit] = useState("");
  const [pct, setPct] = useState("");
  const [heure, setHeure] = useState("");
  const [service, setService] = useState("");
  const [imprevuText, setImprevuText] = useState("");
  const [durationId, setDurationId] = useState("3h");
  const [alertImg, setAlertImg] = useState("");
  const [alertImgLoading, setAlertImgLoading] = useState(false);
  const [visitCode, setVisitCode] = useState("");
  const [visitResult, setVisitResult] = useState(null);
  const [scannerOpen, setScannerOpen] = useState(false);

  if (!shop) return null;
  const plan = planOf(shop);
  const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const alertsThisWeek = posts.filter((p) => p.type === "alerte" && p.createdAt > weekAgo).length;
  const alertLimitReached = alertsThisWeek >= plan.alertsPerWeek;
  const activePresets = alertMode === "promo" ? PROMO_PRESETS : alertMode === "creneau" ? CRENEAU_PRESETS : null;
  const preset = activePresets ? activePresets.find((p) => p.id === presetId) || activePresets[0] : null;
  const preview =
    alertMode === "promo"
      ? preset.build(produit, pct)
      : alertMode === "creneau"
      ? preset.build(heure, service, pct)
      : imprevuText;
  const activeDurations = alertMode === "imprevu" ? IMPREVU_DURATIONS : ALERT_DURATIONS;

  async function handleAlertImgChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setAlertImgLoading(true);
    try {
      const dataUrl = await resizeImageFile(file, 900, 0.7);
      setAlertImg(dataUrl);
    } catch (err) {
      /* ignore */
    }
    setAlertImgLoading(false);
  }

  async function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setPostImgLoading(true);
    try {
      const dataUrl = await resizeImageFile(file);
      setPostImg(dataUrl);
    } catch (err) {
      setPostImg("");
    }
    setPostImgLoading(false);
  }

  return (
    <div>
      <button className="ghost-link" onClick={onBack}>
        ← Retour
      </button>
      <div className="shop-header" style={{ background: categoryOf(shop.category).grad }}>
        <div className="shop-mark large">{categoryOf(shop.category).emoji}</div>
        <div className="shop-header-text">
          <h1>{shop.name}</h1>
          <p className="shop-city">{categoryOf(shop.category).label} · {shop.city}</p>
        </div>
      </div>
      <div className="shop-header-bar">
        <div className="shop-row-meta">
          <Stars value={stats.avg} />
          <span className="meta-text">
            {stats.count > 0 ? `${stats.avg.toFixed(1)} (${stats.count} avis)` : "Pas encore noté"}
          </span>
          <span className="meta-dot">·</span>
          <span className="meta-text">{stats.followers} abonné{stats.followers > 1 ? "s" : ""}</span>
        </div>
      </div>

      {shop.reward && (
        <button
          type="button"
          className="cta-btn scan-quick-btn"
          onClick={() => {
            setVisitResult(null);
            setScannerOpen(true);
          }}
        >
          📷 Scanner la carte de fidélité d'un client
        </button>
      )}
      {scannerOpen && (
        <QRScanner
          onClose={() => setScannerOpen(false)}
          onDetect={(rawValue) => {
            const code = rawValue.replace(/^ETAL-/, "");
            setScannerOpen(false);
            setVisitCode(code);
            setVisitResult(onValidateVisit(code));
            setSection("fidelite");
          }}
        />
      )}
      {(() => {
        const lastTs = posts.length > 0 ? Math.max(...posts.map((p) => p.createdAt)) : shop.createdAt || Date.now();
        const inactiveDays = Math.floor((Date.now() - lastTs) / (24 * 60 * 60 * 1000));
        return (
          inactiveDays >= 14 && (
            <p className="upsell-note" style={{ margin: "0 20px 14px" }}>
              💤 Rien publié depuis {inactiveDays} jours — une petite actu ou une alerte flash rappelle votre existence à vos abonnés.
            </p>
          )
        );
      })()}

      <nav className="subtabs">
        <button className={section === "posts" ? "subtab active" : "subtab"} onClick={() => setSection("posts")}>
          Publier
        </button>
        <button className={section === "alert" ? "subtab active" : "subtab"} onClick={() => setSection("alert")}>
          Alerte flash
        </button>
        <button className={section === "avis" ? "subtab active" : "subtab"} onClick={() => setSection("avis")}>
          Avis
        </button>
        <button className={section === "fidelite" ? "subtab active" : "subtab"} onClick={() => setSection("fidelite")}>
          Fidélité
        </button>
        <button className={section === "stats" ? "subtab active" : "subtab"} onClick={() => setSection("stats")}>
          📊 Stats
        </button>
        <button className={section === "edit" ? "subtab active" : "subtab"} onClick={() => setSection("edit")}>
          Modifier la page
        </button>
      </nav>

      {section === "stats" && (
        <div className="stats-grid">
          {plan.fullStats ? (
            <>
              <div className="stat-card">
                <span className="stat-number">{views.total}</span>
                <span className="stat-label">Vues totales</span>
              </div>
              <div className="stat-card">
                <span className="stat-number">{views.monthly?.[new Date().toISOString().slice(0, 7)] || 0}</span>
                <span className="stat-label">Vues ce mois-ci</span>
              </div>
            </>
          ) : null}
          <div className="stat-card">
            <span className="stat-number">{stats.followers}</span>
            <span className="stat-label">Abonnés</span>
          </div>
          <div className="stat-card">
            <span className="stat-number">{stats.count > 0 ? stats.avg.toFixed(1) : "—"}</span>
            <span className="stat-label">Note moyenne ({stats.count} avis)</span>
          </div>
          <div className="stat-card">
            <span className="stat-number">{posts.length}</span>
            <span className="stat-label">Publications</span>
          </div>
        </div>
      )}
      {section === "stats" && !plan.fullStats && (
        <p className="upsell-note">🔒 Statistiques de vues détaillées réservées aux offres Pro et Premium.</p>
      )}

      {section === "stats" && (
        <>
          <h2 className="section-title">Clients fidélité</h2>
          {customers.length === 0 ? (
            <EmptyState
              title="Aucun client pour l'instant."
              sub="Ils apparaîtront ici dès leur premier passage validé via la carte de fidélité."
            />
          ) : (
            <ul className="shop-list">
              {customers.map((c) => {
                const lastVisit = c.visits[c.visits.length - 1];
                const daysSince = lastVisit ? Math.floor((Date.now() - lastVisit) / (24 * 60 * 60 * 1000)) : null;
                const goal = shop.loyaltyGoal || 6;
                const closeToReward = c.stamps > 0 && goal - c.stamps <= 2;
                const needsRelaunch = daysSince !== null && daysSince >= 30;
                const tier = customerTier(c.totalVisits);
                return (
                  <li key={c.username} className="shop-card" style={{ cursor: "default" }}>
                    {c.profilePhoto ? (
                      <img className="shop-mark customer-photo" src={c.profilePhoto} alt={c.username} />
                    ) : (
                      <div className="shop-mark" style={{ background: "var(--indigo)" }}>
                        {c.username.slice(0, 1).toUpperCase()}
                      </div>
                    )}
                    <div className="shop-row-body">
                      <div className="shop-row-head">
                        <span className="shop-name">{c.username}</span>
                        <span className="new-badge">{c.stamps} tampon{c.stamps > 1 ? "s" : ""}</span>
                        {tier && <span className="milestone-badge">{tier.emoji} {tier.label}</span>}
                        {closeToReward && <span className="milestone-badge">🎯 Proche récompense</span>}
                        {needsRelaunch && <span className="open-badge closed">📣 À relancer</span>}
                      </div>
                      <p className="loyalty-hint">
                        {c.totalVisits} passage{c.totalVisits > 1 ? "s" : ""} au total
                        {c.redeemed > 0 ? ` · ${c.redeemed} récompense${c.redeemed > 1 ? "s" : ""} obtenue${c.redeemed > 1 ? "s" : ""}` : ""}
                        {lastVisit ? ` · dernier passage le ${new Date(lastVisit).toLocaleDateString("fr-FR")}` : ""}
                      </p>
                    </div>
                  </li>
                );
              })}
            </ul>
          )}
        </>
      )}

      {section === "posts" && (
        <div className="compose-box">
          <textarea
            placeholder="Une actualité pour vos abonnés…"
            value={postText}
            onChange={(e) => setPostText(e.target.value)}
            rows={3}
          />
          <label className="file-label">
            Photo depuis votre galerie (optionnel)
            <input type="file" accept="image/*" onChange={handleFileChange} />
          </label>
          {postImgLoading && <p className="preview-label">Compression de la photo…</p>}
          {postImg && !postImgLoading && (
            <div className="compose-preview-wrap">
              <img className="compose-preview" src={postImg} alt="Aperçu" />
              <button type="button" className="secondary-btn small" onClick={() => setPostImg("")}>
                Retirer la photo
              </button>
            </div>
          )}
          <button
            className="cta-btn small"
            disabled={!postText.trim() || postImgLoading}
            onClick={() => {
              onPublishPost(postText, postImg);
              setPostText("");
              setPostImg("");
            }}
          >
            Publier
          </button>
        </div>
      )}

      {section === "alert" && (
        <div className="compose-box">
          <div className="mode-switch">
            <button
              type="button"
              className={alertMode === "promo" ? "mode-btn active" : "mode-btn"}
              onClick={() => {
                setAlertMode("promo");
                setPresetId(PROMO_PRESETS[0].id);
                setDurationId("3h");
              }}
            >
              🔥 Promo
            </button>
            <button
              type="button"
              className={alertMode === "creneau" ? "mode-btn active" : "mode-btn"}
              onClick={() => {
                setAlertMode("creneau");
                setPresetId(CRENEAU_PRESETS[0].id);
                setDurationId("3h");
              }}
            >
              📅 Créneau
            </button>
            <button
              type="button"
              className={alertMode === "imprevu" ? "mode-btn active" : "mode-btn"}
              onClick={() => {
                setAlertMode("imprevu");
                setDurationId("30m");
              }}
            >
              🏃 Imprévu
            </button>
          </div>
          {alertMode !== "imprevu" && (
            <div className="preset-row">
              {activePresets.map((p) => (
                <button
                  key={p.id}
                  type="button"
                  className={presetId === p.id ? "preset-chip active" : "preset-chip"}
                  onClick={() => setPresetId(p.id)}
                >
                  {p.label}
                </button>
              ))}
            </div>
          )}
          {alertMode === "promo" && (
            <div className="alert-inputs">
              <input
                placeholder="Produit concerné"
                value={produit}
                onChange={(e) => setProduit(e.target.value)}
              />
              <input
                placeholder="% de remise"
                type="number"
                min="0"
                max="90"
                value={pct}
                onChange={(e) => setPct(e.target.value)}
              />
            </div>
          )}
          {alertMode === "creneau" && (
            <div className="alert-inputs">
              <input
                placeholder="Heure (ex. 14h30)"
                value={heure}
                onChange={(e) => setHeure(e.target.value)}
              />
              <input
                placeholder="Prestation"
                value={service}
                onChange={(e) => setService(e.target.value)}
              />
            </div>
          )}
          {alertMode === "imprevu" && (
            <textarea
              placeholder="ex. Je reviens dans 30 minutes (livraison en cours)"
              value={imprevuText}
              onChange={(e) => setImprevuText(e.target.value)}
              rows={2}
            />
          )}
          <p className="preview-label">
            {alertMode === "imprevu"
              ? "Durée de votre indisponibilité — l'alerte s'auto-détruit à la fin"
              : "Durée de validité — supprimée automatiquement ensuite"}
          </p>
          <div className="preset-row">
            {activeDurations.map((d) => (
              <button
                key={d.id}
                type="button"
                className={durationId === d.id ? "preset-chip active" : "preset-chip"}
                onClick={() => setDurationId(d.id)}
              >
                {d.label}
              </button>
            ))}
          </div>
          <p className="preview-label">Photo (optionnel)</p>
          <label className="file-label">
            <input type="file" accept="image/*" onChange={handleAlertImgChange} />
          </label>
          {alertImgLoading && <p className="preview-label">Compression de la photo…</p>}
          {alertImg && !alertImgLoading && (
            <div className="compose-preview-wrap">
              <img className="compose-preview" src={alertImg} alt="Aperçu" />
              <button type="button" className="secondary-btn small" onClick={() => setAlertImg("")}>
                Retirer la photo
              </button>
            </div>
          )}
          <p className="preview-label">Aperçu de l'alerte telle qu'elle apparaîtra dans le fil :</p>
          <ul className="post-list" style={{ padding: 0 }}>
            <PostCard
              post={{ id: "preview", shopId: shop.id, type: "alerte", kind: alertMode, text: preview, imageUrl: alertImg, createdAt: Date.now() }}
              shop={shop}
            />
          </ul>
          {alertLimitReached && (
            <p className="upsell-note">
              🔒 Limite de {plan.alertsPerWeek} alerte{plan.alertsPerWeek > 1 ? "s" : ""}/semaine atteinte pour l'offre {plan.label}. Passez à l'offre Pro pour des alertes illimitées.
            </p>
          )}
          {!isWithinAlertHours() && (
            <p className="upsell-note">
              🌙 Les alertes ne peuvent être envoyées qu'entre 9h et 19h, du lundi au samedi — jamais le dimanche — pour ne pas déranger vos abonnés en dehors des horaires habituels des commerces.
            </p>
          )}
          <button
            className="cta-btn small alert-cta"
            disabled={alertLimitReached || !isWithinAlertHours() || (alertMode === "imprevu" && !imprevuText.trim())}
            onClick={() => {
              const duration = activeDurations.find((d) => d.id === durationId) || activeDurations[0];
              onPublishAlert(preview, alertMode, duration.ms, alertImg);
              setProduit("");
              setPct("");
              setHeure("");
              setService("");
              setImprevuText("");
              setAlertImg("");
            }}
          >
            Envoyer l'alerte ({(activeDurations.find((d) => d.id === durationId) || activeDurations[0]).label})
          </button>
        </div>
      )}

      {section === "fidelite" && (
        <div className="compose-box">
          {shop.reward ? (
            <>
              <p className="preview-label">
                Programme actif : {shop.reward} — objectif {shop.loyaltyGoal || 6} passages.
              </p>
              <p className="loyalty-hint">
                Le scan rapide se trouve en haut de la page (bouton « 📷 Scanner la carte de fidélité d'un client »).
              </p>
              <label>
                Ou code du client (indiqué sous son QR code)
                <input
                  value={visitCode}
                  onChange={(e) => setVisitCode(e.target.value)}
                  placeholder="ex. 8F2K1A"
                />
              </label>
              <button
                className="cta-btn small"
                onClick={() => setVisitResult(onValidateVisit(visitCode))}
              >
                Valider ce passage
              </button>
              {visitResult && (
                <p className={visitResult.ok ? "loyalty-hint success" : "loyalty-hint error"}>
                  {visitResult.message}
                </p>
              )}
            </>
          ) : (
            <EmptyState
              title="Aucun programme de fidélité configuré."
              sub="Ajoutez une récompense depuis « Modifier la page » pour l'activer."
            />
          )}
        </div>
      )}

      {section === "avis" && (
        <ul className="review-list">
          {ratings.length === 0 && <EmptyState title="Aucun avis pour l'instant." sub="" />}
          {ratings.map(([username, r]) => (
            <ReviewRow key={username} username={username} r={r} onReply={onReply} canReply={plan.reviewReply} />
          ))}
        </ul>
      )}

      {section === "edit" && (
        <ShopForm
          title="Modifier la page"
          initial={{
            name: shop.name,
            category: shop.category,
            city: shop.city,
            description: shop.description,
            reward: shop.reward || "",
            loyaltyGoal: String(shop.loyaltyGoal || 6),
            siret: shop.siret || "",
            coverPhoto: shop.coverPhoto || "",
            gallery: shop.gallery || [],
            plan: shop.plan || "free",
            phone: shop.phone || "",
            hours: shop.hours
              ? Object.fromEntries(
                  WEEKDAYS.map((d) => {
                    const day = shop.hours[d.id] || { closed: true };
                    const slots =
                      day.slots || (day.open && day.close ? [{ open: day.open, close: day.close }] : [{ open: "09:00", close: "19:00" }]);
                    return [d.id, { closed: !!day.closed, slots }];
                  })
                )
              : Object.fromEntries(WEEKDAYS.map((d) => [d.id, { closed: d.id === "sun", slots: [{ open: "09:00", close: "19:00" }] }])),
          }}
          onCancel={() => setSection("posts")}
          onSubmit={(form) => {
            onUpdateShop(form);
            setSection("posts");
          }}
        />
      )}

      {section !== "edit" && section !== "messages" && section !== "stats" && (
        <>
          <h2 className="section-title">Historique des publications</h2>
          {posts.length === 0 ? (
            <EmptyState title="Rien de publié pour l'instant." sub="" />
          ) : (
            <ul className="post-list">
              {posts.map((p) => (
                <PostCard key={p.id} post={p} shop={shop} />
              ))}
            </ul>
          )}
        </>
      )}
    </div>
  );
}

                      {shop.city} · SIRET {shop.siret || "—"} · par {shop.ownerUsername}

function CityAutocomplete({ value, onChange, onSelectCoords, placeholder }) {
  const [suggestions, setSuggestions] = useState([]);
  const [loading, setLoading] = useState(false);

  async function search() {
    if (!value || !value.trim()) return;
    setLoading(true);
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(value)}`
      );
      const json = await res.json();
      setSuggestions(json || []);
    } catch (e) {
      setSuggestions([]);
    }
    setLoading(false);
  }

  return (
    <div className="city-autocomplete">
      <div className="city-input-row">
        <input
          value={value}
          onChange={(e) => {
            onChange(e.target.value);
            setSuggestions([]);
          }}
          placeholder={placeholder || "Nom de la ville"}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              search();
            }
          }}
        />
        <button type="button" className="secondary-btn small" onClick={search} disabled={loading}>
          {loading ? "…" : "🔍 Rechercher"}
        </button>
      </div>
      {suggestions.length > 0 && (
        <ul className="city-suggestions">
          {suggestions.map((s, i) => (
            <li
              key={i}
              onClick={() => {
                const shortName = s.display_name.split(",")[0];
                onChange(shortName);
                if (onSelectCoords) onSelectCoords({ lat: parseFloat(s.lat), lng: parseFloat(s.lon) });
                setSuggestions([]);
              }}
            >
              {s.display_name}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

  const [pseudo, setPseudo] = useState("");

  const [newPassword, setNewPassword] = useState("");

    e.preventDefault();
    if (!pseudo.trim() || !email.trim() || !newPassword) {

      return;

    if (newPassword.length < 4) {

      return;

    if (newPassword !== confirmNew) {
      setError("Les mots de passe ne correspondent pas.");
      return;

    setError("");
    onReset(pseudo, email, newPassword, setError);
  }

  return (

          <li>
            <span className="vp-icon">💬</span>
            <span>Posez vos questions directement, avec des réponses immédiates</span>
          </li>
        </ul>
        {!isSignup && faceIdSupported && faceIdUsers && faceIdUsers.length > 0 && (
          <div className="faceid-block">
            {faceIdUsers.map((u) => (
              <button
                key={u}
                type="button"
                className="cta-btn faceid-btn"
                onClick={() => onFaceIdLogin(u)}
              >
                🔓 Se connecter avec Face ID / Touch ID ({u})
              </button>
            ))}
            {faceIdError && <p className="field-error">{faceIdError}</p>}
            <p className="footnote" style={{ margin: "8px 0 16px" }}>— ou avec ton mot de passe —</p>
          </div>
        )}
        <form className="login-form" onSubmit={onSubmit}>
          <label htmlFor="pseudo">Votre nom ou pseudo</label>
          <input
            id="pseudo"
            value={pseudoInput}
            onChange={(e) => setPseudoInput(e.target.value)}
            placeholder="ex. Camille Roy"
            autoFocus
          />
          <PasswordField
            id="password"
            label={isSignup ? "Créez un mot de passe" : "Mot de passe"}
            value={passwordInput}
            onChange={(e) => setPasswordInput(e.target.value)}
            placeholder="••••••••"
          />
          {isSignup && (
            <>
              <PasswordField
                id="confirm-password"
                label="Confirmez le mot de passe"
                value={confirmPasswordInput}
                onChange={(e) => setConfirmPasswordInput(e.target.value)}
                placeholder="••••••••"
              />
              <label htmlFor="recovery-email">Adresse e-mail</label>
              <input
                id="recovery-email"
                type="email"
                value={recoveryEmailInput}
                onChange={(e) => setRecoveryEmailInput(e.target.value)}
                placeholder="vous@exemple.com"
              />
              <label htmlFor="first-name">Prénom (optionnel)</label>
              <input
                id="first-name"
                value={firstNameInput}
                onChange={(e) => setFirstNameInput(e.target.value)}
                placeholder="ex. Camille"
              />
              <label htmlFor="last-name">Nom (optionnel)</label>
              <input
                id="last-name"
                value={lastNameInput}
                onChange={(e) => setLastNameInput(e.target.value)}
                placeholder="ex. Roy"
              />
              <label htmlFor="phone-input">Numéro de téléphone (optionnel)</label>
              <input
                id="phone-input"
                value={phoneInput}
                onChange={(e) => setPhoneInput(e.target.value)}
                placeholder="ex. 06 12 34 56 78"
              />
            </>
          )}
          {loginError && <p className="field-error">{loginError}</p>}
          <button className="cta-btn" type="submit">
            {isSignup ? "Créer mon compte" : "Se connecter"}
          </button>
        </form>
        {!isSignup && (
          <button type="button" className="switch-auth-link" onClick={onForgotPassword}>
            Mot de passe oublié ?
          </button>
        )}
        <button
          type="button"
          className="switch-auth-link"
          onClick={() => {
            setAuthMode(isSignup ? "login" : "signup");
          }}
        >
          {isSignup ? "J'ai déjà un compte" : "Pas encore de compte ? Créer un compte"}
        </button>
      <p className="footnote">
        {shopCount > 0
          ? `${shopCount} commerce${shopCount > 1 ? "s" : ""} déjà présent${shopCount > 1 ? "s" : ""}.`
          : "Premier commerce à venir."}
      </p>
      </div>
    </div>
  );
}

        .loyalty-code { font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; margin: 0; }

        .mode-switch { display: flex; gap: 8px; background: var(--line); border-radius: 999px; padding: 4px; }
        .mode-btn { flex: 1; border: none; background: none; font-size: 13px; font-weight: 600; color: var(--ink-soft); padding: 8px 10px; border-radius: 999px; cursor: pointer; }
        .mode-btn.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
        .field-error { color: var(--coral); font-size: 12px; font-weight: 600; }
        .faceid-block { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .faceid-btn { background: linear-gradient(135deg, var(--indigo), var(--coral)); }
        .hours-editor { display: flex; flex-direction: column; gap: 10px; }
        .hours-day-block { display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
        .hours-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .hours-day { width: 30px; flex: none; font-weight: 600; }
        .hours-closed { display: flex; align-items: center; gap: 4px; flex: none; font-weight: 400; color: var(--ink-soft); }
        .hours-row input[type="time"] { width: 88px; padding: 6px 8px; font-size: 12px; }
        .open-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
        .open-badge.open { background: #E3F8EA; color: #1E8C5A; }
        .open-badge.closed { background: #FDEBEC; color: var(--coral); }
        .open-badge.imprevu { background: #FFF3D6; color: #A6790F; }
        .new-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #EAF3FF; color: #5643D6; }
        .milestone-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #FFF3D6; color: #A6790F; }
        .loyalty-reminder { font-size: 13px; font-weight: 700; color: var(--coral); margin: 4px 0 0; }
        .loyalty-reminder.small { font-size: 11px; margin: 2px 0 0; }
        .mute-btn { background: var(--card); border: 2px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; flex: none; padding: 7px 12px; white-space: nowrap; }
        .sort-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .sort-label { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
        .sort-row select { width: auto; padding: 8px 10px; font-size: 13px; }
        .trending-row { margin-bottom: 16px; }
        .trending-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-top: 6px; }
        .trending-card {
          flex: none; width: 140px; height: 90px; border-radius: 16px; border: none; cursor: pointer;
          background-size: cover; background-position: center; display: flex; flex-direction: column;
          justify-content: flex-end; align-items: flex-start; padding: 10px; box-shadow: var(--shadow);
        }
        .trending-name { color: #fff; font-size: 13px; font-weight: 700; text-align: left; }
        .trending-meta { color: rgba(255,255,255,0.85); font-size: 11px; }
        .gallery-preview-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .gallery-thumb-wrap { position: relative; width: 72px; height: 72px; }
        .gallery-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
        .gallery-thumb-remove {
          position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
          background: var(--coral); color: #fff; border: 2px solid var(--card); font-size: 10px; cursor: pointer; padding: 0;
        }
        .shop-gallery-row { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 4px; }
        .shop-gallery-row img { width: 110px; height: 110px; object-fit: cover; border-radius: 14px; flex: none; }

        .profile-head { display: flex; align-items: center; gap: 14px; padding: 8px 20px 4px; }
        .profile-head h1 { font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 700; margin: 0; flex: 1; }
        .profile-photo-wrap { position: relative; width: 60px; height: 60px; flex: none; cursor: pointer; display: block; }
        .profile-photo { width: 60px; height: 60px; border-radius: 18px; object-fit: cover; display: block; }
        .customer-photo { object-fit: cover; }
        .profile-photo-edit {
          position: absolute; bottom: -4px; right: -4px; width: 24px; height: 24px; border-radius: 50%;
          background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center;
          font-size: 12px; border: 2px solid var(--card);
        }
        .settings-gear { font-size: 18px; }
        .settings-menu { display: flex; flex-direction: column; gap: 8px; }
        .settings-row {
          display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--line);
          border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--ink);
          cursor: pointer; text-align: left; width: 100%;
        }
        .settings-row.danger { color: var(--coral); border-color: #FDEBEC; }
        .loyalty-card-row {
          display: flex; align-items: center; gap: 14px; padding: 14px;
          background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
          margin-bottom: 12px; cursor: pointer;
        }
        .stamp-row.small { gap: 3px; }
        .stamp-row.small .stamp { width: 14px; height: 14px; font-size: 8px; }
        .loyalty-code.small { font-family: 'Baloo 2', sans-serif; font-size: 13px; font-weight: 700; color: var(--indigo-deep); flex: none; }
        .review-row { cursor: pointer; }
        .review-head { justify-content: space-between; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
        .stat-number { font-family: 'Baloo 2', sans-serif; font-size: 26px; font-weight: 700; color: var(--indigo-deep); }
        .stat-label { font-size: 12px; color: var(--ink-soft); }

        .post-list { padding: 0 20px; }
        .post-card {
          position: relative;
          background: var(--card);
          border-radius: 18px;
          box-shadow: var(--shadow);
          padding: 14px 16px;
          margin-bottom: 12px;
        }
        .post-tag {
          display: inline-block; background: linear-gradient(135deg, var(--coral), #FF3B57);
          color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
        }
        .post-tag.creneau { background: linear-gradient(135deg, var(--indigo), #3D5AFE); }
        .post-tag.imprevu { background: linear-gradient(135deg, #FFB238, #FF8A3D); }
        .post-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); flex-wrap: wrap; }
        .post-shop-mark { width: 26px; height: 26px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; }
        .post-shop-name { font-weight: 700; color: var(--ink); }
        .post-time { margin-left: auto; }
        .post-text { font-size: 14px; margin: 10px 0 0; line-height: 1.55; }
        .post-image { width: 100%; max-height: 220px; object-fit: cover; margin-top: 10px; border-radius: 14px; }

        .subtabs { display: flex; gap: 6px; padding-top: 4px; margin: 0 0 16px; flex-wrap: wrap; }
        .subtab { font-size: 13px; font-weight: 600; color: var(--ink-soft); background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
        .subtab.active { color: #fff; background: var(--indigo); border-color: var(--indigo); }

        .compose-box { display: flex; flex-direction: column; gap: 12px; }
        .file-label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
        .file-label input[type="file"] { border: 2px dashed var(--line); border-radius: 14px; padding: 10px; font-size: 13px; background: var(--card); }
        .compose-preview-wrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
        .compose-preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 14px; }
        .preset-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .preset-chip { font-size: 12px; font-weight: 600; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
        .preset-chip.active { background: var(--amber); border-color: var(--amber); color: #23233A; }
        .alert-inputs { display: flex; gap: 10px; }
        .preview-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin: 4px 0 0; }

        .review-row { padding: 14px 0; border-top: 1px solid var(--line); }
        .merchant-reply { background: #F0EDFF; border-radius: 12px; padding: 8px 12px; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .merchant-reply .loyalty-hint { color: #4A3B5C; }
        .reply-form { display: flex; gap: 8px; margin-top: 8px; }
        .reply-form input { flex: 1; }
        .review-head { display: flex; align-items: center; gap: 8px; font-size: 12px; }

        .onboarding-screen { max-width: 480px; margin: 0 auto; padding: 32px 24px; }
        .onboarding-screen.no-pad { max-width: none; padding: 4px 20px 0; margin: 0; }
        .onboarding-screen h1 { font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 18px; }
        .profile-form { display: flex; flex-direction: column; gap: 16px; }
        .profile-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }

        .empty-state { padding: 36px 0; text-align: center; }
        .empty-title { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
        .empty-sub { font-size: 13px; color: var(--ink-soft); margin: 0; }

        .chat-picker-overlay {
          position: fixed; inset: 0; background: rgba(20,20,35,0.4);
          display: flex; align-items: flex-end; justify-content: center; z-index: 50;
        }
        .chat-picker-sheet {
          background: var(--bg); width: 100%; max-width: 720px;
          border-radius: 22px 22px 0 0; padding: 16px 20px 24px; max-height: 70vh; overflow-y: auto;
        }
        .chat-picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .chat-picker-head .ghost-link { padding: 0; }
        .scanner-video { width: 100%; border-radius: 16px; background: #000; max-height: 60vh; }

        .bottom-nav {
          position: fixed; left: 0; right: 0; bottom: 0;
          display: flex; justify-content: center; gap: 4px;
          background: var(--card); border-top: 1px solid var(--line);
          padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
          max-width: 720px; margin: 0 auto;
        }
        .nav-btn {
          flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
          background: none; border: none; color: var(--ink-soft); font-size: 11px; font-weight: 600;
          padding: 6px 4px; cursor: pointer; border-radius: 14px; position: relative;
        }
        .nav-btn.active { color: #5643D6; background: #F0EDFF; }
        .nav-icon { font-size: 19px; position: relative; }
        .nav-badge {
          position: absolute; top: -6px; right: -10px; background: var(--coral); color: #fff;
          font-size: 9px; font-weight: 700; border-radius: 999px; padding: 1px 5px;
        }

        @media (max-width: 480px) {
          .login-screen h1 { font-size: 24px; }
          .shop-header { flex-wrap: wrap; }
        }
      `}</style>
      {children}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<EtalApp />);
</script>
</body>
</html>
