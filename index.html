// ---- QRMath.js ----
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

// ---- QRPolynomial.js ----

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};


// ---- QR8bitByte.js ----

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};


// ---- QRBitBuffer.js ----
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};


function generateQRMatrix(text, ec) {
  var level = (typeof QRErrorCorrectLevel !== "undefined" && QRErrorCorrectLevel[ec]) || QRErrorCorrectLevel.M;
  var qr = new QRCode(-1, level);
  qr.addData(text);
  qr.make();
  var count = qr.getModuleCount();
  var matrix = [];
  for (var r = 0; r < count; r++) {
    var row = [];
    for (var c = 0; c < count; c++) row.push(qr.isDark(r, c));
    matrix.push(row);
  }
  return matrix;
}

function isWithinAlertHours() {
  const now = new Date();
  if (now.getDay() === 0) return false;

function followerBadge(count) {

function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + (m || 0);
}

function getDaySlots(shop, dayId) {
  const h = shop?.hours?.[dayId];
  if (!h || h.closed) return [];
  if (Array.isArray(h.slots) && h.slots.length) {
    return h.slots.filter((s) => s && s.open && s.close);
  }
  if (h.open && h.close) return [{ open: h.open, close: h.close }];
  return [];
}

function isOpenNow(shop) {
  if (!shop?.hours) return null;
  const now = new Date();
  const dayId = WEEKDAYS[now.getDay()].id;
  const slots = getDaySlots(shop, dayId);
  if (slots.length === 0) return false;
  const cur = now.getHours() * 60 + now.getMinutes();
  return slots.some((s) => {
    const openMin = timeToMinutes(s.open);
    let closeMin = timeToMinutes(s.close);
    if (closeMin <= openMin) closeMin += 24 * 60;
    return cur >= openMin && cur < closeMin;
  });
}

function closingSoonMinutes(shop) {
  if (!isOpenNow(shop)) return null;
  const now = new Date();
  const dayId = WEEKDAYS[now.getDay()].id;
  const slots = getDaySlots(shop, dayId);
  const cur = now.getHours() * 60 + now.getMinutes();
  for (const s of slots) {
    const openMin = timeToMinutes(s.open);
    let closeMin = timeToMinutes(s.close);
    if (closeMin <= openMin) closeMin += 24 * 60;
    if (cur >= openMin && cur < closeMin) {
      const diff = closeMin - cur;
      return diff > 0 && diff <= 45 ? diff : null;
    }
  }
  return null;
}

function reopenLabel(shop) {
  const now = new Date();
  const dayId = WEEKDAYS[now.getDay()].id;
  const slots = getDaySlots(shop, dayId);
  const cur = now.getHours() * 60 + now.getMinutes();
  const upcoming = slots
    .map((s) => ({ ...s, openMin: timeToMinutes(s.open) }))
    .filter((s) => s.openMin > cur)
    .sort((a, b) => a.openMin - b.openMin)[0];
  if (!upcoming) return null;
  const diff = upcoming.openMin - cur;
  const h = Math.floor(diff / 60);
  const m = diff % 60;
  if (h > 0) return `réouvre dans ${h}h${m > 0 ? String(m).padStart(2, "0") : ""}`;
  return `réouvre dans ${m} min`;
}

function openStatusLabel(shop) {
  if (isOpenNow(shop)) {
    const mins = closingSoonMinutes(shop);
    if (!mins) return "Ouvert";
    const reopen = reopenLabel(shop);
    return reopen ? `Ferme dans ${mins} min, ${reopen}` : `Ferme dans ${mins} min`;
  }
  const reopen = reopenLabel(shop);
  return reopen ? `Fermé — ${reopen}` : "Fermé";
}

function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

async function geocodeCity(city) {
  if (!city || !city.trim()) return null;
  const res = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(city)}`
  );
  const json = await res.json();
  if (json && json[0]) {
    return { lat: parseFloat(json[0].lat), lng: parseFloat(json[0].lon) };
  }
  return null;
}

async function hashPassword(pw) {
  try {
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf))
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
  } catch (e) {
    return "plain:" + pw;
  }
}

// --- Face ID / Touch ID (via WebAuthn) ---------------------------------
// Utilise le capteur biométrique déjà intégré au téléphone (aucun service
// externe, aucun coût). Le déverrouillage biométrique est vérifié par le
// système d'exploitation lui-même ; une fois réussi, on retrouve l'identité
// du compte à partir de l'identifiant d'accès enregistré sur cet appareil.
function faceIdStorageKey(username) {
  return `etal_faceid_${username}`;
}

async function faceIdAvailable() {
  try {
    return !!(
      window.PublicKeyCredential &&
      (await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())
    );
  } catch (e) {
    return false;
  }
}

function faceIdRegisteredUsernames() {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("etal_faceid_")) out.push(k.replace("etal_faceid_", ""));
  }
  return out;
}

async function registerFaceId(username) {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const publicKey = {
    challenge,
    rp: { name: "Étal" },
    user: {
      id: new TextEncoder().encode(username),
      name: username,
      displayName: username,
    },
    pubKeyCredParams: [
      { type: "public-key", alg: -7 },
      { type: "public-key", alg: -257 },
    ],
    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
    timeout: 60000,
    attestation: "none",
  };
  const cred = await navigator.credentials.create({ publicKey });
  const id = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem(faceIdStorageKey(username), id);
  return true;
}

function disableFaceId(username) {
  localStorage.removeItem(faceIdStorageKey(username));
}

async function loginWithFaceId(username) {
  const storedId = localStorage.getItem(faceIdStorageKey(username));
  if (!storedId) return false;
  const idBytes = Uint8Array.from(atob(storedId), (c) => c.charCodeAt(0));
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const publicKey = {
    challenge,
    allowCredentials: [{ id: idBytes, type: "public-key" }],
    userVerification: "required",
    timeout: 60000,
  };
  try {
    await navigator.credentials.get({ publicKey });
    return true;
  } catch (e) {
    return false;
  }
}

function resizeImageFile(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image failed"));
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function relTime(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `il y a ${h} h`;
  const d = Math.floor(h / 24);
  return `il y a ${d} j`;
}

  const followers = Object.values(data.follows).filter((list) =>

  return { avg, count, followers };

          delete r[username];

        }
        if (nextLoyalty[shopId]?.[username]) {
          const l = { ...nextLoyalty[shopId] };
          delete l[username];
          nextLoyalty[shopId] = l;
        }
      }
    });

    persist({
      ...data,
      accounts: nextAccounts,
      shops: nextShops,
      posts: nextPosts,
      ratings: nextRatings,
      loyalty: nextLoyalty,
      views: nextViews,
      reports: nextReports,
      follows: nextFollows,
      muted: nextMuted,
      lastSeen: nextLastSeen,
    });
    setMe(null);
    setTab("discover");
    setPasswordInput("");
    setPseudoInput("");
  }

  function changePassword(currentPassword, newPassword) {
    const account = data.accounts?.[me] || {};
    return hashPassword(currentPassword).then((currentHash) => {
      if (account.passwordHash !== currentHash) {
        return { ok: false, message: "Mot de passe actuel incorrect." };
      }
      if (!newPassword || newPassword.length < 4) {
        return { ok: false, message: "Le nouveau mot de passe doit faire au moins 4 caractères." };
      }
      return hashPassword(newPassword).then((newHash) => {
        persist({ ...data, accounts: { ...data.accounts, [me]: { ...account, passwordHash: newHash } } });
        return { ok: true, message: "Mot de passe mis à jour." };
      });
    });
  }

  function renameUsername(newUsernameRaw) {
    const newKey = normKey(newUsernameRaw || "");
    if (!newKey) return Promise.resolve({ ok: false, message: "Choisissez un identifiant." });
    if (newKey === me) return Promise.resolve({ ok: false, message: "C'est déjà votre identifiant actuel." });
    if (data.accounts?.[newKey]) return Promise.resolve({ ok: false, message: "Cet identifiant est déjà pris." });

    const oldKey = me;
    const account = data.accounts[oldKey];
    const nextAccounts = { ...data.accounts };
    delete nextAccounts[oldKey];
    nextAccounts[newKey] = account;

    const nextShops = {};
    Object.entries(data.shops || {}).forEach(([id, shop]) => {
      nextShops[id] = shop.ownerUsername === oldKey ? { ...shop, ownerUsername: newKey } : shop;
    });

    function migrateKeyedByUsername(obj) {
      if (!obj || !obj[oldKey]) return obj;
      const next = { ...obj };
      next[newKey] = next[oldKey];
      delete next[oldKey];
      return next;
    }

    const nextFollows = migrateKeyedByUsername(data.follows);
    const nextMuted = migrateKeyedByUsername(data.muted);
    const nextLastSeen = migrateKeyedByUsername(data.lastSeen);

    const nextRatings = {};
    Object.entries(data.ratings || {}).forEach(([shopId, byUser]) => {
      nextRatings[shopId] = migrateKeyedByUsername(byUser);
    });
    const nextLoyalty = {};
    Object.entries(data.loyalty || {}).forEach(([shopId, byUser]) => {
      nextLoyalty[shopId] = migrateKeyedByUsername(byUser);
    });

    const nextReports = {};
    Object.entries(data.reports || {}).forEach(([shopId, list]) => {
      nextReports[shopId] = (list || []).map((r) => (r.by === oldKey ? { ...r, by: newKey } : r));
    });

    persist({
      ...data,
      accounts: nextAccounts,
      shops: nextShops,
      follows: nextFollows,
      muted: nextMuted,
      lastSeen: nextLastSeen,
      ratings: nextRatings,
      loyalty: nextLoyalty,
      reports: nextReports,
    });

    // Migre aussi l'enregistrement Face ID local, propre à cet appareil.
    const oldFaceId = localStorage.getItem(faceIdStorageKey(oldKey));
    if (oldFaceId) {
      localStorage.setItem(faceIdStorageKey(newKey), oldFaceId);
      localStorage.removeItem(faceIdStorageKey(oldKey));
    }

    setMe(newKey);
    return Promise.resolve({ ok: true, message: `Identifiant changé pour "${newKey}".` });
  }

  function cancelSubscription() {
    const owned = Object.values(data.shops || {}).filter((s) => s.ownerUsername === me && s.plan && s.plan !== "free");
    if (owned.length === 0) {
      return { ok: false, message: "Aucun abonnement payant actif pour l'instant." };
    }
    const nextShops = { ...data.shops };
    owned.forEach((s) => {
      nextShops[s.id] = { ...s, plan: "free" };
    });
    persist({ ...data, shops: nextShops });
    return {
      ok: true,
      message: `Abonnement résilié pour ${owned.length} commerce${owned.length > 1 ? "s" : ""} — retour à l'offre Gratuite.`,
    };
  }

  function adminDeleteAccount(username) {
    const nextAccounts = { ...data.accounts };
    delete nextAccounts[username];

    const nextShops = { ...data.shops };
    const nextPosts = { ...data.posts };
    const nextRatings = { ...data.ratings };
    const nextLoyalty = { ...data.loyalty };
    const nextViews = { ...data.views };
    const nextReports = { ...data.reports };
    const nextFollows = { ...data.follows };
    const nextMuted = { ...data.muted };
    const nextLastSeen = { ...data.lastSeen };

    delete nextFollows[username];
    delete nextMuted[username];
    delete nextLastSeen[username];

    Object.entries(nextShops).forEach(([shopId, shop]) => {
      if (shop.ownerUsername === username) {
        delete nextShops[shopId];
        Object.keys(nextPosts).forEach((pid) => {
          if (nextPosts[pid].shopId === shopId) delete nextPosts[pid];

        delete nextRatings[shopId];
        delete nextLoyalty[shopId];
        delete nextViews[shopId];
        delete nextReports[shopId];
      } else {
        if (nextRatings[shopId]?.[username]) {
          const r = { ...nextRatings[shopId] };
          delete r[username];
          nextRatings[shopId] = r;
        }
        if (nextLoyalty[shopId]?.[username]) {
          const l = { ...nextLoyalty[shopId] };
          delete l[username];
          nextLoyalty[shopId] = l;
        }
      }
    });

    persist({
      ...data,
      accounts: nextAccounts,
      shops: nextShops,
      posts: nextPosts,
      ratings: nextRatings,
      loyalty: nextLoyalty,
      views: nextViews,
      reports: nextReports,
      follows: nextFollows,
      muted: nextMuted,
      lastSeen: nextLastSeen,
    });
  }

  function adminDismissReports(shopId) {

  function submitRating(shopId, criteria, comment) {
    const shopRatings = { ...(data.ratings[shopId] || {}) };
    const shop = data.shops[shopId];
    const existing = shopRatings[me];
    const couponCode = existing?.couponCode || (shop?.reward ? genCode() : undefined);
    const stars = (criteria.quality + criteria.welcome + criteria.value) / 3;
    shopRatings[me] = {
      stars,
      quality: criteria.quality,
      welcome: criteria.welcome,
      value: criteria.value,
      comment: comment.trim(),
      createdAt: Date.now(),
      ...(existing?.reply ? { reply: existing.reply } : {}),
      ...(couponCode ? { couponCode } : {}),
    };
    persist({ ...data, ratings: { ...data.ratings, [shopId]: shopRatings } });
  }

  function replyToRating(shopId, username, replyText) {
    const shopRatings = { ...(data.ratings[shopId] || {}) };

    shopRatings[username] = { ...entry, reply: replyText.trim() };

  function patchShopCoords(shopId, coords) {
    if (!coords) return;
    setData((prev) => {
      if (!prev.shops[shopId]) return prev;
      const next = {
        ...prev,
        shops: { ...prev.shops, [shopId]: { ...prev.shops[shopId], lat: coords.lat, lng: coords.lng } },
      };
      etalStorage.set(STORAGE_KEY, JSON.stringify(next), true).catch(() => {});
      return next;
    });
  }

  function createShop(form) {
    const ownedCount = Object.values(data.shops).filter((s) => s.ownerUsername === me).length;
    if (ownedCount >= SHOP_LIMIT_PER_ACCOUNT) {
      return { ok: false, message: `Limite atteinte : ${SHOP_LIMIT_PER_ACCOUNT} commerces maximum par compte.` };
    }
    const id = uid();
    const shop = {
      id,
      ownerUsername: me,
      name: form.name.trim(),
      category: form.category,
      city: form.city.trim(),
      description: form.description.trim(),
      reward: form.reward.trim(),
      loyaltyGoal: Number(form.loyaltyGoal) || 6,
      siret: form.siret.trim(),
      coverPhoto: form.coverPhoto || "",
      gallery: form.gallery || [],
      phone: (form.phone || "").trim(),
      plan: form.plan || "free",
      hours: form.hours || null,
      approved: false,
      createdAt: Date.now(),
    };
    persist({ ...data, shops: { ...data.shops, [id]: shop } });
    if (form.lat && form.lng) {
      patchShopCoords(id, { lat: form.lat, lng: form.lng });
    } else {
      geocodeCity(shop.city).then((coords) => patchShopCoords(id, coords)).catch(() => {});

    setCreatingShop(false);
    setManagingShop(id);
    setTab("mine");
    return { ok: true };

  function updateShop(shopId, form) {
    const shop = {
      ...data.shops[shopId],

      category: form.category,

      description: form.description.trim(),
      reward: form.reward.trim(),

      siret: form.siret.trim(),
      coverPhoto: form.coverPhoto || "",

      plan: form.plan || "free",

    if (form.lat && form.lng) {
      patchShopCoords(shopId, { lat: form.lat, lng: form.lng });

      geocodeCity(shop.city).then((coords) => patchShopCoords(shopId, coords)).catch(() => {});

      const nextV = {
        total: v.total + 1,

      };
      const next = { ...prev, views: { ...(prev.views || {}), [shopId]: nextV } };
      etalStorage.set(STORAGE_KEY, JSON.stringify(next), true).catch(() => {});
      return next;

  function useMyLocation() {
    if (!navigator.geolocation) {
      setLocError("La géolocalisation n'est pas disponible ici.");
      return;
    }
    setLocError("");
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        setUserLocation({ lat: latitude, lng: longitude });
        setSortMode("distance");
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`
          );
          const json = await res.json();
          const addr = json?.address || {};
          const city = addr.city || addr.town || addr.village || addr.municipality || "";
          if (city) setFilterCity(city);
        } catch (e) {
          /* reverse geocoding failed, keep coordinates only */
        }
        setLocating(false);
      },
      () => {
        setLocError("Impossible d'accéder à votre position.");
        setLocating(false);
      },
      { enableHighAccuracy: false, timeout: 8000 }
    );
  }

  function searchCityLocation() {
    if (!filterCity.trim()) return;
    setLocError("");
    setLocating(true);
    geocodeCity(filterCity)
      .then((coords) => {
        setLocating(false);
        if (coords) {
          setUserLocation(coords);
          setSortMode("distance");
        } else setLocError("Ville introuvable.");
      })
      .catch(() => {
        setLocating(false);
        setLocError("Recherche de ville indisponible dans cet aperçu — ça fonctionnera dans la vraie application.");
      });
  }

  function validateVisit(shopId, codeRaw) {
    const code = codeRaw.trim().toUpperCase();
    if (!code) return { ok: false, message: "Entrez un code." };
    const shopLoyalty = data.loyalty[shopId] || {};
    const entry = Object.entries(shopLoyalty).find(([, v]) => v.code === code);
    if (!entry) return { ok: false, message: "Code introuvable." };
    const [username, v] = entry;
    const today = new Date().toDateString();
    if (v.lastVisit && new Date(v.lastVisit).toDateString() === today) {
      return { ok: false, message: `${username} a déjà été validé aujourd'hui.` };
    }
    const goal = data.shops[shopId]?.loyaltyGoal || 6;
    let stamps = (v.stamps || 0) + 1;
    let redeemed = v.redeemed || 0;
    let rewardUnlocked = false;
    if (stamps >= goal) {
      stamps = 0;
      redeemed += 1;
      rewardUnlocked = true;
    }
    const prevTotalVisits = v.totalVisits || (v.visits || []).length;
    const totalVisits = prevTotalVisits + 1;
    const prevTier = customerTier(prevTotalVisits);
    const newTier = customerTier(totalVisits);
    const tierUp = newTier && newTier !== prevTier;
    const nextEntry = {
      ...v,
      stamps,
      redeemed,
      totalVisits,
      lastVisit: Date.now(),
      visits: [...(v.visits || []), Date.now()].slice(-20),
    };
    persist({
      ...data,
      loyalty: { ...data.loyalty, [shopId]: { ...shopLoyalty, [username]: nextEntry } },
    });
    const base = rewardUnlocked
      ? `Passage validé pour ${username} — récompense débloquée : ${data.shops[shopId]?.reward || ""}`
      : `Passage validé pour ${username} — ${stamps}/${goal} tampons.`;
    return {
      ok: true,
      message: tierUp ? `${base} ${newTier.emoji} ${username} devient "${newTier.label}" !` : base,
    };
  }

  const followed = new Set(data.follows[me] || []);
  const filShopIds = Array.from(followed);
  const filPosts = Object.values(data.posts)
    .filter((p) => {
      if (!followed.has(p.shopId)) return false;
      const level = getMuteLevel(data.muted[me], p.shopId);
      if (level === "none") return false;
      if (level === "urgent") {
        return p.type === "alerte" && (p.kind === "creneau" || p.kind === "imprevu");
      }
      return true;
    })
    .sort((a, b) => b.createdAt - a.createdAt);
  const lastSeen = data.lastSeen[me] || 0;
  const unread = filPosts.filter((p) => p.createdAt > lastSeen).length;

  const allShops = Object.values(data.shops);
  const myHabits = data.accounts?.[me]?.habits || [];
  const discoverList = allShops
    .filter((s) => isShopVisible(s) || s.ownerUsername === me)
    .filter((s) => (filterCat ? s.category === filterCat : true))
    .filter((s) => {
      if (userLocation || !filterCity.trim()) return true;
      const q = filterCity.trim().toLowerCase();
      const cityMatch = s.city.toLowerCase().includes(q);
      const catMatch = categoryOf(s.category).label.toLowerCase().includes(q);
      return cityMatch || catMatch;
    })
    .filter((s) => (openNowOnly ? isOpenNow(s) === true : true))
    .filter((s) => (recommendedOnly ? myHabits.includes(s.category) : true))
    .map((s) => ({
      shop: s,
      stats: shopStats(data, s.id),
      distanceKm:
        userLocation && s.lat && s.lng ? distanceKm(userLocation.lat, userLocation.lng, s.lat, s.lng) : null,
    }))
    .sort((a, b) => {
      const aBoost = planOf(a.shop).priorityPlacement && (a.distanceKm == null || a.distanceKm <= PRIORITY_PLACEMENT_RADIUS_KM);
      const bBoost = planOf(b.shop).priorityPlacement && (b.distanceKm == null || b.distanceKm <= PRIORITY_PLACEMENT_RADIUS_KM);
      if (aBoost !== bBoost) return aBoost ? -1 : 1;
      if (sortMode === "distance" && userLocation) {
        if (a.distanceKm == null && b.distanceKm == null) return b.stats.avg - a.stats.avg;
        if (a.distanceKm == null) return 1;
        if (b.distanceKm == null) return -1;
        return a.distanceKm - b.distanceKm;
      }
      if (sortMode === "newest") return (b.shop.createdAt || 0) - (a.shop.createdAt || 0);
      if (sortMode === "followers") return b.stats.followers - a.stats.followers;
      return b.stats.avg - a.stats.avg || b.stats.followers - a.stats.followers;
    });

  const myShops = allShops.filter((s) => s.ownerUsername === me);
  const trendingShops = allShops
    .filter((s) => isShopVisible(s) && planOf(s).trending)
    .map((s) => ({ shop: s, followers: shopStats(data, s.id).followers }))
    .filter((t) => t.followers > 0)
    .sort((a, b) => b.followers - a.followers)

  const myFollowedShops = filShopIds.map((id) => data.shops[id]).filter(Boolean);
  const myRatedShops = allShops.filter((s) => (data.ratings[s.id] || {})[me]);
  const myLoyaltyCards = allShops.filter(
    (s) => s.reward && (data.loyalty[s.id] || {})[me]

  const myVisitHistory = allShops
    .flatMap((s) => {
      const visits = (data.loyalty[s.id] || {})[me]?.visits || [];
      return visits.map((ts) => ({ shop: s, ts }));
    })
    .sort((a, b) => b.ts - a.ts)
    .slice(0, 30);
  const isDark = !!data.accounts?.[me]?.darkMode;
  const isAdmin = !!data.accounts?.[me]?.isAdmin;
  const reportedShopsCount = Object.keys(data.reports || {}).filter(
    (id) => (data.reports[id] || []).length > 0 && data.shops[id]

          <p className="topbar-appname">Étal</p>

function QRCodeSVG({ value, size = 180 }) {
  const matrix = generateQRMatrix(value, "M");
  const count = matrix.length;
  const quiet = 2;
  const total = count + quiet * 2;
  const cells = [];
  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (matrix[r][c]) cells.push({ r, c });
    }
  }
  return (
    <svg
      width={size}
      height={size}
      viewBox={`0 0 ${total} ${total}`}
      role="img"
      aria-label="QR code"
      style={{ background: "#fff", display: "block" }}
    >
      <rect x={0} y={0} width={total} height={total} fill="#ffffff" />
      {cells.map(({ r, c }) => (
        <rect key={`${r}-${c}`} x={c + quiet} y={r + quiet} width={1} height={1} fill="#000000" />
      ))}
    </svg>
  );
}

function Stars({ value }) {
  const rounded = Math.round(value * 2) / 2;
  return (
    <span className="stars" aria-hidden="true">
      {[1, 2, 3, 4, 5].map((n) => (
        <span key={n} className={n <= rounded ? "star filled" : "star"}>
          ★
        </span>
      ))}
    </span>
  );
}

  const isAlert = post.type === "alerte";
  const isCreneau = isAlert && post.kind === "creneau";
  const isImprevu = isAlert && post.kind === "imprevu";
  return (
    <li className={isAlert ? "post-card alert" : "post-card"}>
      {isAlert && (
        <span className={isCreneau ? "post-tag creneau" : isImprevu ? "post-tag imprevu" : "post-tag"}>
          {isCreneau ? "📅 Créneau dispo" : isImprevu ? "🏃 Imprévu" : "🔥 Alerte flash"}

// Centre de la France par défaut, tant qu'on n'a ni position ni commerce localisé.
const DEFAULT_MAP_CENTER = [46.6034, 1.8883];

function ShopsMapView({ shops, userLocation, onOpenShop }) {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef([]);
  const userMarkerRef = useRef(null);
  const initedRef = useRef(false);
  const [libReady, setLibReady] = useState(typeof window !== "undefined" && !!window.L);

  const located = shops.filter((s) => typeof s.lat === "number" && typeof s.lng === "number");
  const missing = shops.length - located.length;

  // La librairie de carte (Leaflet) se charge depuis une CDN — on attend
  // qu'elle soit prête si la page vient tout juste de s'ouvrir.
  useEffect(() => {
    if (libReady) return;
    const id = setInterval(() => {
      if (typeof window !== "undefined" && window.L) {
        setLibReady(true);
        clearInterval(id);
      }
    }, 150);
    return () => clearInterval(id);
  }, [libReady]);

  // Création de la vraie carte interactive (une seule fois).
  useEffect(() => {
    if (!libReady || !mapDivRef.current || initedRef.current) return;
    initedRef.current = true;
    const center = userLocation
      ? [userLocation.lat, userLocation.lng]
      : located[0]
      ? [located[0].lat, located[0].lng]
      : DEFAULT_MAP_CENTER;
    const zoom = userLocation || located.length ? 13 : 5;
    const map = window.L.map(mapDivRef.current, { zoomControl: true }).setView(center, zoom);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(map);
    mapRef.current = map;
    return () => {
      map.remove();
      mapRef.current = null;
      initedRef.current = false;
    };
  }, [libReady]);

  // Mise à jour des marqueurs commerces à chaque changement de liste.
  useEffect(() => {
    if (!mapRef.current || !window.L) return;
    markersRef.current.forEach((m) => mapRef.current.removeLayer(m));
    markersRef.current = located.map((s) => {
      const icon = window.L.divIcon({
        className: "map-pin-icon",
        html: `<span class="map-pin-emoji" style="background:${categoryOf(s.category).grad}">${categoryOf(s.category).emoji}</span>`,
        iconSize: [34, 34],
        iconAnchor: [17, 17],
      });
      const marker = window.L.marker([s.lat, s.lng], { icon }).addTo(mapRef.current);
      marker.bindTooltip(s.name, { direction: "top" });
      marker.on("click", () => onOpenShop(s));
      return marker;
    });
  }, [located, libReady]);

  // Marqueur "vous êtes ici" + recentrage quand la localisation change.
  useEffect(() => {
    if (!mapRef.current || !window.L) return;
    if (userMarkerRef.current) {
      mapRef.current.removeLayer(userMarkerRef.current);
      userMarkerRef.current = null;
    }
    if (userLocation) {
      const userIcon = window.L.divIcon({
        className: "map-pin-icon",
        html: `<span class="map-pin-emoji user-map-pin">📍</span>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
      });
      userMarkerRef.current = window.L.marker([userLocation.lat, userLocation.lng], { icon: userIcon }).addTo(mapRef.current);
      mapRef.current.setView([userLocation.lat, userLocation.lng], 13);
    }
  }, [userLocation, libReady]);

  if (!libReady) {
    return <EmptyState title="Chargement de la carte…" sub="Un instant." />;
  }
  if (located.length === 0 && !userLocation) {
    return (
      <EmptyState
        title="Aucun commerce localisé pour l'instant."
        sub="Un commerce apparaît sur la carte une fois sa ville géolocalisée."
      />
    );
  }

  return (
    <>
      <div ref={mapDivRef} className="leaflet-map-canvas" />
      {missing > 0 && (
        <p className="loyalty-hint">
          {missing} commerce{missing > 1 ? "s" : ""} non localisé{missing > 1 ? "s" : ""}, absent{missing > 1 ? "s" : ""} de la carte.
        </p>
      )}
    </>
  );
}

function ShopForm({ onCancel, onSubmit, title, initial }) {
  const [form, setForm] = useState(
    initial || {
      name: "",
      category: CATEGORIES[0].id,
      city: "",
      description: "",
      reward: "",
      loyaltyGoal: "6",
      siret: "",
      coverPhoto: "",
      gallery: [],
      phone: "",
      plan: "free",
      hours: Object.fromEntries(
        WEEKDAYS.map((d) => [d.id, { closed: d.id === "sun", slots: [{ open: "09:00", close: "19:00" }] }])
      ),
    }
  );
  const [siretError, setSiretError] = useState("");
  const [phoneError, setPhoneError] = useState("");
  const [coverLoading, setCoverLoading] = useState(false);
  const [galleryLoading, setGalleryLoading] = useState(false);
  function set(field) {
    return (e) => setForm((f) => ({ ...f, [field]: e.target.value }));
  }
  function setDaySlot(dayId, slotIndex, field, value) {
    setForm((f) => {
      const day = f.hours[dayId] || { closed: false, slots: [{ open: "09:00", close: "19:00" }] };
      const slots = [...(day.slots || [{ open: "09:00", close: "19:00" }])];
      slots[slotIndex] = { ...slots[slotIndex], [field]: value };
      return { ...f, hours: { ...f.hours, [dayId]: { ...day, slots } } };
    });
  }
  function setDayClosed(dayId, closed) {
    setForm((f) => ({ ...f, hours: { ...f.hours, [dayId]: { ...f.hours[dayId], closed } } }));
  }
  function addBreak(dayId) {
    setForm((f) => {
      const day = f.hours[dayId] || { closed: false, slots: [{ open: "09:00", close: "19:00" }] };
      const slots = [...(day.slots || [{ open: "09:00", close: "19:00" }])];
      slots.push({ open: "14:00", close: "19:00" });
      return { ...f, hours: { ...f.hours, [dayId]: { ...day, slots } } };
    });
  }
  function removeBreak(dayId) {
    setForm((f) => {
      const day = f.hours[dayId];
      if (!day || !day.slots) return f;
      return { ...f, hours: { ...f.hours, [dayId]: { ...day, slots: day.slots.slice(0, 1) } } };
    });
  }
  async function handleCoverChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setCoverLoading(true);
    try {
      const dataUrl = await resizeImageFile(file, 1000, 0.72);
      setForm((f) => ({ ...f, coverPhoto: dataUrl }));
    } catch (err) {
      /* ignore */
    }
    setCoverLoading(false);
  }
  async function handleGalleryChange(e) {
    const files = Array.from(e.target.files || []).slice(0, 6 - (form.gallery || []).length);
    if (files.length === 0) return;
    setGalleryLoading(true);
    try {
      const dataUrls = await Promise.all(files.map((f) => resizeImageFile(f, 900, 0.7)));
      setForm((f) => ({ ...f, gallery: [...(f.gallery || []), ...dataUrls].slice(0, 6) }));
    } catch (err) {
      /* ignore */
    }
    setGalleryLoading(false);
  }
  function removeGalleryPhoto(idx) {
    setForm((f) => ({ ...f, gallery: f.gallery.filter((_, i) => i !== idx) }));
  }
  return (
    <div className="onboarding-screen no-pad">
      <h1>{title}</h1>
      <form
        className="profile-form"
        onSubmit={(e) => {
          e.preventDefault();
          const siretDigits = form.siret.replace(/\s+/g, "");
          if (!/^\d{14}$/.test(siretDigits)) {
            setSiretError("Le SIRET doit comporter exactement 14 chiffres.");
            return;
          }
          if (!form.phone.trim()) {
            setSiretError("");
            setPhoneError("Le numéro de téléphone est obligatoire.");
            return;
          }
          setSiretError("");
          setPhoneError("");
          if (!form.name.trim() || !form.city.trim()) return;
          onSubmit({ ...form, siret: siretDigits });
        }}
      >
        <label>
          Votre offre
          <div className="plan-picker">
            {Object.values(PLANS).map((p) => (
              <button
                key={p.id}
                type="button"
                className={form.plan === p.id ? "plan-card active" : "plan-card"}
                onClick={() => setForm((f) => ({ ...f, plan: p.id }))}
              >
                <span className="plan-card-name">{p.label}</span>
                <span className="plan-card-price">{p.price}</span>
                <ul className="plan-card-features">
                  <li>{p.alertsPerWeek === Infinity ? "Alertes illimitées" : `${p.alertsPerWeek} alerte/semaine`}</li>
                  <li>{p.gallery ? "Galerie photo" : "Pas de galerie"}</li>
                  <li>{p.loyalty ? "Fidélité + QR" : "Pas de fidélité"}</li>
                  <li>Réponse aux avis</li>
                  {p.priorityPlacement && <li>📍 Placement prioritaire dans les résultats à proximité</li>}
                  {p.targetedAlerts && <li>🎯 Alertes ciblées aux clients fidèles</li>}
                  {p.multiShop && <li>🏬 Plusieurs commerces sur un seul compte</li>}
                </ul>
              </button>
            ))}
          </div>
        </label>
        <label>
          Nom du commerce
          <input value={form.name} onChange={set("name")} required />
        </label>
        <label className="file-label">
          Photo de couverture (optionnel)
          <input type="file" accept="image/*" onChange={handleCoverChange} />
        </label>
        {coverLoading && <p className="preview-label">Compression de la photo…</p>}
        {form.coverPhoto && !coverLoading && (
          <div className="compose-preview-wrap">
            <img className="compose-preview" src={form.coverPhoto} alt="Aperçu couverture" />
            <button
              type="button"
              className="secondary-btn small"
              onClick={() => setForm((f) => ({ ...f, coverPhoto: "" }))}
            >
              Retirer la photo
            </button>
          </div>
        )}
        {PLANS[form.plan]?.gallery ? (
          <>
            <label className="file-label">
              Galerie photo (jusqu'à 6, optionnel)
              <input
                type="file"
                accept="image/*"
                multiple
                onChange={handleGalleryChange}
                disabled={(form.gallery || []).length >= 6}
              />
            </label>
            {galleryLoading && <p className="preview-label">Compression des photos…</p>}
            {(form.gallery || []).length > 0 && (
              <div className="gallery-preview-row">
                {form.gallery.map((src, i) => (
                  <div key={i} className="gallery-thumb-wrap">
                    <img className="gallery-thumb" src={src} alt="" />
                    <button type="button" className="gallery-thumb-remove" onClick={() => removeGalleryPhoto(i)}>
                      ✕
                    </button>
                  </div>
                ))}
              </div>
            )}
          </>
        ) : (
          <p className="upsell-note">🔒 Galerie photo réservée aux offres Pro et Premium.</p>
        )}
        <label>
          Numéro de SIRET
          <input
            value={form.siret}
            onChange={set("siret")}
            placeholder="14 chiffres"
            inputMode="numeric"
            required
          />
          {siretError && <span className="field-error">{siretError}</span>}
        </label>
        <label>
          Métier
          <select value={form.category} onChange={set("category")}>
            {CATEGORIES.map((c) => (
              <option key={c.id} value={c.id}>
                {c.emoji} {c.label}
              </option>
            ))}
          </select>
        </label>
        <label>
          Ville
          <CityAutocomplete
            value={form.city}
            onChange={(v) => setForm((f) => ({ ...f, city: v }))}
            onSelectCoords={(coords) => setForm((f) => ({ ...f, lat: coords.lat, lng: coords.lng }))}
            placeholder="ex. Lyon"
          />
        </label>
        <label>
          Téléphone
          <input value={form.phone} onChange={set("phone")} placeholder="ex. 06 12 34 56 78" required />
          {phoneError && <span className="field-error">{phoneError}</span>}
        </label>
        <label>
          Horaires d'ouverture
          <div className="hours-editor">
            {WEEKDAYS.map((d) => {
              const h = form.hours[d.id] || {};
              const slots = h.slots || [{ open: "09:00", close: "19:00" }];
              return (
                <div key={d.id} className="hours-day-block">
                  <div className="hours-row">
                    <span className="hours-day">{d.label}</span>
                    <label className="hours-closed">
                      <input
                        type="checkbox"
                        checked={!!h.closed}
                        onChange={(e) => setDayClosed(d.id, e.target.checked)}
                      />
                      Fermé
                    </label>
                  </div>
                  {!h.closed && (
                    <>
                      {slots.map((slot, i) => (
                        <div key={i} className="hours-row">
                          <input
                            type="time"
                            value={slot.open || "09:00"}
                            onChange={(e) => setDaySlot(d.id, i, "open", e.target.value)}
                          />
                          <span>–</span>
                          <input
                            type="time"
                            value={slot.close || "19:00"}
                            onChange={(e) => setDaySlot(d.id, i, "close", e.target.value)}
                          />
                          {i === 1 && (
                            <button type="button" className="ghost-link" onClick={() => removeBreak(d.id)}>
                              Retirer
                            </button>
                          )}
                        </div>
                      ))}
                      {slots.length < 2 && (
                        <button type="button" className="ghost-link" onClick={() => addBreak(d.id)}>
                          + Ajouter une pause (ex. déjeuner)
                        </button>
                      )}
                    </>
                  )}
                </div>
              );
            })}
          </div>
        </label>
        <label>
          Description
          <textarea value={form.description} onChange={set("description")} rows={3} />
        </label>
        {PLANS[form.plan]?.loyalty ? (
          <>
            <label>
              Récompense fidélité (optionnel)
              <input
                value={form.reward}
                onChange={set("reward")}
                placeholder="ex. -5% dès 50€ d'achats cumulés"
              />
            </label>
            {form.reward && (
              <label>
                Nombre de passages pour débloquer la récompense
                <input
                  type="number"
                  min="2"
                  max="30"
                  value={form.loyaltyGoal}
                  onChange={set("loyaltyGoal")}
                />
              </label>
            )}
          </>
        ) : (
          <p className="upsell-note">🔒 Carte de fidélité réservée aux offres Pro et Premium.</p>
        )}
        <div className="form-actions">
          <button type="button" className="secondary-btn" onClick={onCancel}>
            Annuler
          </button>
          <button className="cta-btn" type="submit">
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  );
}

function QRScanner({ onDetect, onClose }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const [error, setError] = useState("");
  const [supported, setSupported] = useState(true);

  useEffect(() => {
    let stream = null;
    let rafId = null;
    let stopped = false;

    async function start() {
      if (typeof navigator === "undefined" || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setSupported(false);
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (stopped) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        // Safari/iPhone n'a pas l'API native BarcodeDetector : on utilise
        // alors jsQR (décodage QR en JS pur, via un canvas caché) en secours.
        const hasNativeDetector = typeof window !== "undefined" && "BarcodeDetector" in window;
        const detector = hasNativeDetector ? new window.BarcodeDetector({ formats: ["qr_code"] }) : null;
        const canvas = canvasRef.current;
        const ctx = canvas ? canvas.getContext("2d", { willReadFrequently: true }) : null;
        const tick = async () => {
          if (stopped) return;
          try {
            if (detector) {
              const codes = await detector.detect(videoRef.current);
              if (codes && codes.length > 0) {
                onDetect(codes[0].rawValue);
                return;
              }
            } else if (typeof window.jsQR === "function" && ctx && videoRef.current && videoRef.current.videoWidth) {
              canvas.width = videoRef.current.videoWidth;
              canvas.height = videoRef.current.videoHeight;
              ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
              const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const result = window.jsQR(frame.data, frame.width, frame.height);
              if (result && result.data) {
                onDetect(result.data);
                return;
              }
            }
          } catch (e) {
            /* single-frame detection failure, keep trying */
          }
          rafId = requestAnimationFrame(tick);
        };
        tick();
      } catch (e) {
        setError("Impossible d'accéder à la caméra ici.");
      }
    }
    start();

    return () => {
      stopped = true;
      if (rafId) cancelAnimationFrame(rafId);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    };
  }, [onDetect]);

  return (
    <div className="chat-picker-overlay" onClick={onClose}>
      <div className="chat-picker-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="chat-picker-head">
          <p className="rate-label">Scanner le QR code du client</p>
          <button className="ghost-link" onClick={onClose}>
            Fermer
          </button>
        </div>
        {!supported ? (
          <EmptyState
            title="Caméra indisponible sur cet appareil."
            sub="Utilisez le code en dessous à la place."
          />
        ) : error ? (
          <EmptyState title={error} sub="Vous pouvez toujours saisir le code manuellement." />
        ) : (
          <video ref={videoRef} className="scanner-video" muted playsInline />
        )}
        <canvas ref={canvasRef} style={{ display: "none" }} />
      </div>
    </div>
  );
}
